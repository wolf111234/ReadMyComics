<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карта глубин</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0d0d0d;
            color: #e0e0e0;
            min-height: 100vh;
            background-image: 
                radial-gradient(ellipse at top, #1a1a2e 0%, transparent 50%),
                radial-gradient(ellipse at bottom, #16213e 0%, transparent 50%);
            overflow-x: hidden;
        }
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: linear-gradient(180deg, rgba(13,13,13,0.95) 0%, rgba(13,13,13,0) 100%);
            padding: 20px 40px 40px;
            z-index: 100;
        }
        .title {
            font-size: 32px;
            font-weight: 700;
            text-align: center;
            letter-spacing: 4px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #00d4ff 0%, #7b2cbf 50%, #ff006e 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(0,212,255,0.3);
        }
        .chapters {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .chapter-btn {
            background: rgba(255,255,255,0.05);
            color: #aaa;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 10px 20px;
            cursor: pointer;
            font-size: 14px;
            border-radius: 25px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        .chapter-btn:hover {
            background: rgba(0,212,255,0.1);
            border-color: #00d4ff;
            color: #fff;
        }
        .chapter-btn.active {
            background: linear-gradient(135deg, #00d4ff 0%, #7b2cbf 100%);
            border-color: transparent;
            color: #fff;
            box-shadow: 0 0 20px rgba(0,212,255,0.4);
        }
        .content {
            max-width: 700px;
            margin: 0 auto;
            padding: 140px 20px 60px;
        }
        .chapter-title {
            font-size: 24px;
            color: #00d4ff;
            margin-bottom: 30px;
            text-align: center;
            font-weight: 300;
            letter-spacing: 2px;
        }
        .page {
            margin-bottom: 20px;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 0.6s ease forwards;
        }
        .page:nth-child(2) { animation-delay: 0.1s; }
        .page:nth-child(3) { animation-delay: 0.2s; }
        .page:nth-child(4) { animation-delay: 0.3s; }
        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .page-image {
            width: 100%;
            display: block;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            cursor: zoom-in;
            transition: transform 0.2s ease;
        }
        .page-image:hover {
            box-shadow: 0 15px 50px rgba(0,212,255,0.2);
        }
        .page-number {
            text-align: center;
            color: #555;
            font-size: 12px;
            margin-top: 8px;
            letter-spacing: 1px;
        }
        
        .zoom-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.95);
            z-index: 200;
            overflow: auto;
            cursor: zoom-out;
        }
        .zoom-overlay.active {
            display: block;
        }
        .zoom-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }
        .zoom-image {
            max-width: 100%;
            cursor: move;
            transform-origin: center center;
            transition: transform 0.1s ease;
        }
        .zoom-hint {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,212,255,0.2);
            color: #00d4ff;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 201;
            border: 1px solid rgba(0,212,255,0.4);
        }
        .close-zoom {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255,0,0,0.3);
            color: #fff;
            border: 1px solid rgba(255,0,0,0.5);
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 25px;
            font-size: 16px;
            z-index: 201;
        }
        .close-zoom:hover {
            background: rgba(255,0,0,0.5);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1 class="title">Карта глубин</h1>
        <div class="chapters" id="chapters"></div>
    </div>
    
    <div class="content" id="content"></div>
    
    <div class="zoom-overlay" id="zoomOverlay">
        <button class="close-zoom" onclick="closeZoom()">✕ Закрыть</button>
        <div class="zoom-container" id="zoomContainer">
            <img class="zoom-image" id="zoomImage" src="" alt="Увеличенное изображение">
        </div>
        <div class="zoom-hint">Кликни вне изображения или нажми Esc для закрытия</div>
    </div>

    <script>
        let chapters = {};
        async function loadChapters() {
            try {
                const response = await fetch('chapters.json');
                chapters = await response.json();
            } catch(e) {
                chapters = {"1": {"title": "Глава 1", "pages": ["Glava1/1.png", "Glava1/2.png"]}};
            }
            init();
        }

        function showChapter(chapterNum) {
            document.querySelectorAll(".chapter-btn").forEach((btn) => {
                btn.classList.toggle("active", btn.textContent.includes(chapterNum));
            });

            const chapter = chapters[chapterNum];
            const content = document.getElementById("content");
            
            content.innerHTML = `<h2 class="chapter-title">${chapter.title}</h2>`;
            
            chapter.pages.forEach((page, index) => {
                content.innerHTML += `
                    <div class="page">
                        <img class="page-image" src="${page}" alt="Страница ${index + 1}" onclick="openZoom('${page}')">
                        <div class="page-number">Страница ${index + 1}</div>
                    </div>
                `;
            });
        }

        function openZoom(src) {
            const overlay = document.getElementById('zoomOverlay');
            const img = document.getElementById('zoomImage');
            img.src = src;
            overlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeZoom() {
            document.getElementById('zoomOverlay').classList.remove('active');
            document.body.style.overflow = '';
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeZoom();
        });

        document.getElementById('zoomOverlay').addEventListener('click', (e) => {
            if (e.target.id === 'zoomOverlay') closeZoom();
        });

        const zoomImg = document.getElementById('zoomImage');
        let scale = 1;
        let isDragging = false;
        let startX, startY, translateX = 0, translateY = 0;

        zoomImg.addEventListener('wheel', (e) => {
            e.preventDefault();
            scale += e.deltaY > 0 ? -0.1 : 0.1;
            scale = Math.min(Math.max(1, scale), 4);
            zoomImg.style.transform = `scale(${scale}) translate(${translateX}px, ${translateY}px)`;
        });

        zoomImg.addEventListener('mousedown', (e) => {
            if (scale > 1) {
                isDragging = true;
                startX = e.clientX - translateX;
                startY = e.clientY - translateY;
            }
        });

        document.addEventListener('mousemove', (e) => {
            if (isDragging && scale > 1) {
                translateX = e.clientX - startX;
                translateY = e.clientY - startY;
                zoomImg.style.transform = `scale(${scale}) translate(${translateX}px, ${translateY}px)`;
            }
        });

        document.addEventListener('mouseup', () => {
            isDragging = false;
        });

        function init() {
            const chaptersContainer = document.getElementById("chapters");
            Object.keys(chapters).sort((a,b) => a-b).forEach(num => {
                chaptersContainer.innerHTML += `<button class="chapter-btn" onclick="showChapter(${num})">Глава ${num}</button>`;
            });
            showChapter(1);
        }

        loadChapters();
    </script>
</body>
</html>
