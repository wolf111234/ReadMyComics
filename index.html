<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карта глубин</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0d0d0d;
            color: #e0e0e0;
            min-height: 100vh;
            background-image: 
                radial-gradient(ellipse at top, #1a1a2e 0%, transparent 50%),
                radial-gradient(ellipse at bottom, #16213e 0%, transparent 50%);
            overflow-x: hidden;
        }
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: linear-gradient(180deg, rgba(13,13,13,0.95) 0%, rgba(13,13,13,0) 100%);
            padding: 20px 40px 40px;
            z-index: 100;
        }
        .title {
            font-size: 32px;
            font-weight: 700;
            text-align: center;
            letter-spacing: 4px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #00d4ff 0%, #7b2cbf 50%, #ff006e 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .chapters {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .chapter-btn {
            background: rgba(255,255,255,0.05);
            color: #aaa;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 10px 20px;
            cursor: pointer;
            font-size: 14px;
            border-radius: 25px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        .chapter-btn:hover {
            background: rgba(0,212,255,0.1);
            border-color: #00d4ff;
            color: #fff;
        }
        .chapter-btn.active {
            background: linear-gradient(135deg, #00d4ff 0%, #7b2cbf 100%);
            border-color: transparent;
            color: #fff;
            box-shadow: 0 0 20px rgba(0,212,255,0.4);
        }
        .chapter-btn.locked {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .timer {
            font-size: 11px;
            background: rgba(255,0,100,0.2);
            padding: 2px 8px;
            border-radius: 10px;
            color: #ff006e;
        }
        .content {
            max-width: 700px;
            margin: 0 auto;
            padding: 140px 20px 60px;
        }
        .chapter-header { text-align: center; margin-bottom: 30px; }
        .chapter-title {
            font-size: 24px;
            color: #00d4ff;
            font-weight: 300;
            letter-spacing: 2px;
        }
        .release-info {
            margin-top: 15px;
            color: #ff006e;
            font-size: 14px;
        }
        .countdown {
            font-size: 20px;
            font-weight: bold;
            margin-top: 8px;
        }
        .page {
            margin-bottom: 20px;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 0.6s ease forwards;
        }
        .page:nth-child(2) { animation-delay: 0.1s; }
        .page:nth-child(3) { animation-delay: 0.2s; }
        .page:nth-child(4) { animation-delay: 0.3s; }
        @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }
        .page-image {
            width: 100%;
            display: block;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            cursor: zoom-in;
        }
        .page-image:hover { box-shadow: 0 15px 50px rgba(0,212,255,0.2); }
        .page-number {
            text-align: center;
            color: #555;
            font-size: 12px;
            margin-top: 8px;
        }
        .zoom-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.95);
            z-index: 200;
            overflow: auto;
        }
        .zoom-overlay.active { display: block; }
        .zoom-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }
        .zoom-image { max-width: 100%; cursor: move; }
        .close-zoom {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255,0,0,0.3);
            color: #fff;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 25px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1 class="title">Карта глубин</h1>
        <div class="chapters" id="chapters"></div>
    </div>
    <div class="content" id="content"></div>
    <div class="zoom-overlay" id="zoomOverlay">
        <button class="close-zoom" onclick="closeZoom()">✕ Закрыть</button>
        <div class="zoom-container">
            <img class="zoom-image" id="zoomImage" src="" alt="">
        </div>
    </div>

    <script>
        const chapters = {
            "1": { "title": "Глава 1", "pages": ["Glava1/1.png", "Glava1/2.png", "Glava1/3.png"] },
            "2": { "title": "Глава 2", "releaseDate": "2026-05-17T18:00:00", "pages": [] }
        };
        
        let currentChapter = 1;
        let timerStart = localStorage.getItem('timer_start');
        if (!timerStart) {
            timerStart = Date.now();
            localStorage.setItem('timer_start', timerStart);
        }

        function getRemaining(releaseDate) {
            const now = new Date();
            const release = new Date(releaseDate);
            const diff = release - now;
            if (diff <= 0) return null;
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const secs = Math.floor((diff % (1000 * 60)) / 1000);
            return { days, hours, mins, secs, total: diff };
        }

        function formatCountdown(releaseDate) {
            const r = getRemaining(releaseDate);
            if (!r) return "Доступно!";
            if (r.days > 0) return `${r.days}д ${r.hours}ч ${r.mins}м`;
            if (r.hours > 0) return `${r.hours}ч ${r.mins}м ${r.secs}с`;
            return `${r.mins}м ${r.secs}с`;
        }

        function isChapterLocked(chapter) {
            return chapter.pages.length === 0 && chapter.releaseDate;
        }

        function showChapter(chapterNum) {
            currentChapter = chapterNum;
            document.querySelectorAll(".chapter-btn").forEach((btn) => {
                btn.classList.toggle("active", btn.dataset.chapter == chapterNum);
            });

            const chapter = chapters[chapterNum];
            const content = document.getElementById("content");
            
            if (isChapterLocked(chapter)) {
                content.innerHTML = `
                    <div class="chapter-header">
                        <h2 class="chapter-title">${chapter.title}</h2>
                        <div class="release-info">
                            <div>Скоро ближайший выход:</div>
                            <div class="countdown" id="countdown">${formatCountdown(chapter.releaseDate)}</div>
                        </div>
                    </div>
                `;
            } else {
                content.innerHTML = `<div class="chapter-header"><h2 class="chapter-title">${chapter.title}</h2></div>`;
                
                chapter.pages.forEach((page, index) => {
                    content.innerHTML += `
                        <div class="page">
                            <img class="page-image" src="${page}" alt="Страница ${index + 1}" onclick="openZoom('${page}')">
                            <div class="page-number">Страница ${index + 1}</div>
                        </div>
                    `;
                });
            }
        }

        function updateTimers() {
            const countdownEl = document.getElementById('countdown');
            if (countdownEl && chapters[currentChapter].releaseDate) {
                countdownEl.textContent = formatCountdown(chapters[currentChapter].releaseDate);
            }
            
            document.querySelectorAll('.chapter-btn').forEach(btn => {
                const num = btn.dataset.chapter;
                const chapter = chapters[num];
                const timerEl = btn.querySelector('.timer');
                if (timerEl && chapter.releaseDate) {
                    timerEl.textContent = formatCountdown(chapter.releaseDate);
                }
            });
        }

        function openZoom(src) {
            document.getElementById('zoomImage').src = src;
            document.getElementById('zoomOverlay').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeZoom() {
            document.getElementById('zoomOverlay').classList.remove('active');
            document.body.style.overflow = '';
        }

        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeZoom(); });

        function init() {
            const container = document.getElementById("chapters");
            Object.keys(chapters).sort((a,b) => a-b).forEach(num => {
                const chapter = chapters[num];
                let btnClass = 'chapter-btn';
                let timerHtml = '';
                
                if (isChapterLocked(chapter)) {
                    btnClass += ' locked';
                    timerHtml = `<span class="timer">${formatCountdown(chapter.releaseDate)}</span>`;
                }
                
                container.innerHTML += `<button class="${btnClass}" data-chapter="${num}" onclick="showChapter(${num})">Глава ${num}${timerHtml}</button>`;
            });
            showChapter(1);
            setInterval(updateTimers, 1000);
            updateTimers();
        }

        init();
    </script>
</body>
</html>
