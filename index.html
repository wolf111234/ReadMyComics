<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
/>

<title>Глубокая карта</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link
  href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
  rel="stylesheet"
/>



<style>

:root{
  --bg:#070b14;
  --panel:#101827ee;
  --panel2:#111827;
  --text:#f1f5f9;
  --muted:#94a3b8;
  --accent:#38bdf8;
  --accent2:#a855f7;
  --success:#10b981;
  --danger:#ff006e;
  --radius:20px;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  scrollbar-width:thin;
  scrollbar-color:#7c3aed #0f172a;
}

html,body{
  height:100%;
}

body{
  font-family:'Inter',sans-serif;
  background:
    radial-gradient(circle at top,#172554 0%,transparent 35%),
    radial-gradient(circle at bottom,#1e1b4b 0%,transparent 40%),
    #070b14;
  color:var(--text);
  overflow:hidden;
}

/* APP */

.app{
  display:grid;
  grid-template-columns:320px 1fr;
  height:100vh;
}

/* SIDEBAR */

.sidebar{
  background:var(--panel);
  backdrop-filter:blur(18px);
  border-right:1px solid rgba(255,255,255,.08);
  overflow:auto;
  padding:18px;
  z-index:100;
}

.brand{
  font-size:30px;
  font-weight:800;
  margin-bottom:18px;

  background:linear-gradient(135deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.tabs{
  display:flex;
  gap:8px;
  margin-bottom:18px;
}

.tab-btn{
  flex:1;
  padding:12px;
  border:none;
  outline:none;
  cursor:pointer;
  border-radius:14px;
  background:#ffffff08;
  color:var(--muted);
  font-weight:600;
  font-size:13px;
  transition:.25s;
}

.tab-btn.active{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:white;
}

.tab-btn:hover:not(.active){
  background:#ffffff15;
}

.download-btn{
  width:100%;
  display:flex;
  justify-content:center;
  align-items:center;

  padding:14px;
  border-radius:16px;

  text-decoration:none;
  color:white;
  font-weight:700;

  background:linear-gradient(135deg,var(--accent),var(--accent2));

  margin-bottom:18px;

  box-shadow:0 10px 40px rgba(56,189,248,.25);
}

.search{
  width:100%;
  padding:14px;
  border:none;
  outline:none;
  border-radius:14px;
  background:#ffffff10;
  color:white;
  margin-bottom:18px;
}

.section-title{
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:2px;
  color:var(--muted);
  margin-bottom:10px;
  margin-top:14px;
}

.volume-btn,
.chapter-btn{
  width:100%;
  border:none;
  outline:none;
  cursor:pointer;

  padding:14px;
  margin-bottom:10px;

  border-radius:16px;

  background:#ffffff08;
  color:white;

  transition:.25s;
  text-align:left;
}

.volume-btn:hover,
.chapter-btn:hover{
  background:#ffffff15;
}

.volume-btn.active,
.chapter-btn.active{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
}

.chapter-btn.read{
  border:1px solid rgba(16,185,129,.55);
}

.chapter-btn.locked{
  opacity:.45;
}

.timer{
  margin-top:8px;
  display:inline-block;
  font-size:11px;
  color:#ff7eb6;
}

/* MAIN */

.main{
  display:flex;
  flex-direction:column;
  height:100vh;
}

/* TOPBAR */

.topbar{
  height:72px;
  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 20px;

  background:#0b1220dd;
  backdrop-filter:blur(16px);

  border-bottom:1px solid rgba(255,255,255,.08);
}

.top-title{
  font-weight:700;
  font-size:18px;
}

.actions{
  position:relative;
  display:flex;
  gap:10px;
}

.btn{
  border:none;
  cursor:pointer;

  padding:10px 14px;

  border-radius:14px;

  background:#ffffff10;
  color:white;

  transition:.25s;
}

.btn:hover{
  background:#ffffff20;
}

/* READER */

.reader{
  flex:1;
  overflow:auto;
  padding:26px;
  scroll-behavior:smooth;
  overscroll-behavior-y:contain;
  -webkit-overflow-scrolling:touch;
}

.reader::-webkit-scrollbar{
  width:10px;
  height:10px;
}

.reader::-webkit-scrollbar-track{
  background:rgba(15,23,42,.65);
  border-radius:999px;
}

.reader::-webkit-scrollbar-thumb{
  background:
    linear-gradient(
      180deg,
      #38bdf8,
      #7c3aed,
      #ec4899
    );
  border-radius:999px;
  border:2px solid rgba(15,23,42,.9);
  transition:.25s;
  box-shadow:
    0 0 10px rgba(168,85,247,.45),
    0 0 20px rgba(56,189,248,.25);
}

.reader::-webkit-scrollbar-thumb:hover{
  background:
    linear-gradient(
      180deg,
      #67e8f9,
      #a855f7,
      #ff4da6
    );
}

.reader::-webkit-scrollbar-corner{
  background:transparent;
}

.chapter-header{
  text-align:center;
  margin-bottom:28px;
}

.chapter-title{
  font-size:36px;
  font-weight:800;

  margin-bottom:14px;

  background:linear-gradient(135deg,var(--accent),var(--accent2));

  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.chapter-meta{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
}

.read-btn{
  border:none;
  cursor:pointer;

  padding:10px 16px;

  border-radius:14px;

  background:#ffffff10;
  color:white;

  font-weight:700;
}

.read-btn.read{
  background:linear-gradient(135deg,#10b981,#059669);
}

.page-wrap{
  position:relative;
  max-width:950px;
  margin:0 auto 24px;
}

.page{
  width:100%;
  display:block;

  border-radius:18px;

  box-shadow:0 20px 60px rgba(0,0,0,.5);

  cursor:zoom-in;
}

.page-number{
  text-align:center;
  color:var(--muted);
  margin-top:10px;
  font-size:12px;
}

/* ZOOM */

.zoom{
  position:fixed;
  inset:0;
  background:black;
  z-index:999;
  display:none;
  overflow:auto;
}

.zoom.active{
  display:block;
}

.zoom img{
  width:100%;
}

.close{
  position:fixed;
  top:20px;
  right:20px;
  z-index:1000;

  border:none;
  cursor:pointer;

  padding:12px 16px;

  border-radius:14px;

  background:#ffffff20;
  color:white;
}

/* CO-READING */

.co-panel{
  position:absolute;
  top:54px;
  right:0;
  width:300px;
  background:#0f172aee;
  backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,.08);
  border-radius:var(--radius);
  padding:16px;
  z-index:200;
  display:none;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
}

.co-panel.show{
  display:block;
}

.co-section{
  margin-bottom:12px;
}

.co-room{
  display:flex;
  gap:8px;
  margin-bottom:8px;
}

.co-input{
  flex:1;
  padding:10px;
  border:none;
  outline:none;
  border-radius:12px;
  background:#ffffff10;
  color:white;
  font-size:13px;
}

.co-input::placeholder{
  color:var(--muted);
}

.co-action{
  padding:10px 12px;
  font-size:13px;
  white-space:nowrap;
}

.co-create{
  width:100%;
  justify-content:center;
}

.co-status{
  font-size:12px;
  color:var(--muted);
  text-align:center;
  margin-top:6px;
}

.co-status.connected{
  color:var(--success);
}

/* MOBILE */

.sidebar-backdrop{
  position:fixed;
  inset:0;

  background:rgba(0,0,0,.55);

  backdrop-filter:blur(4px);

  z-index:90;

  opacity:0;
  pointer-events:none;

  transition:.25s;
}

.sidebar-backdrop.show{
  opacity:1;
  pointer-events:auto;
}

.mobile-nav{
  display:none;
}

@media(max-width:900px){

  .reader::-webkit-scrollbar{
    width:4px;
  }

  .app{
    grid-template-columns:1fr;
  }

  .sidebar{
    position:fixed;
    inset:0 18% 0 0;

    transform:translateX(-100%);
    transition:.3s;
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .reader{
    padding-bottom:100px;
  }

  .mobile-nav{
    position:fixed;

    left:0;
    right:0;
    bottom:0;

    height:74px;

    background:#0b1220ee;

    backdrop-filter:blur(16px);

    display:flex;
    justify-content:space-around;
    align-items:center;

    border-top:1px solid rgba(255,255,255,.08);

    z-index:90;
  }

}

/* UPDATE BANNER */

#updateBanner{

  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:999;

  background:linear-gradient(135deg,#7c3aed,#2563eb);

  color:#fff;
  text-align:center;
  padding:12px 16px;

  font-size:14px;
  font-weight:600;

  cursor:pointer;

  transform:translateY(-100%);
  transition:transform .4s ease;

}

#updateBanner.show{
  transform:translateY(0);
}

#updateBanner span{
  text-decoration:underline;
}

#updateBanner .close-banner{
  position:absolute;
  right:12px;
  top:50%;
  transform:translateY(-50%);
  background:none;
  border:none;
  color:#fff;
  font-size:18px;
  cursor:pointer;
  opacity:.7;
}

#updateBanner .close-banner:hover{
  opacity:1;
}

</style>
</head>
<body>

<div id="updateBanner" onclick="dismissBanner()">
  <span>⬇ Доступно обновление APK</span>
  <button class="close-banner" onclick="event.stopPropagation();dismissBanner()">✕</button>
</div>

<div
  class="sidebar-backdrop"
  id="sidebarBackdrop"
  onclick="closeSidebar()">
</div>

<div class="app">

  <!-- SIDEBAR -->

  <aside class="sidebar" id="sidebar">

    <div class="brand">
      Глубокая карта
    </div>

    <a
      class="download-btn"
      href="https://github.com/wolf111234/Comics-APK/releases/latest"
      target="_blank"
    >
      📱 Скачать приложение
    </a>

    <div class="tabs">
      <button class="tab-btn active" data-tab="volumes" onclick="switchTab('volumes')">📖 Тома</button>
      <button class="tab-btn" data-tab="theories" onclick="switchTab('theories')">📜 Теории</button>
    </div>

    <input
      class="search"
      id="search"
      placeholder="Поиск главы..."
    >

    <div id="volumesSection">
      <div class="section-title">Тома</div>
      <div id="volumes"></div>
      <div class="section-title">Главы</div>
      <div id="chapters"></div>
    </div>

    <div id="theoriesSection" style="display:none">
      <div class="section-title">Теории</div>
      <a class="download-btn" href="https://github.com/wolf111234/ReadMyComics/issues/new?assignees=&labels=theory&projects=&template=theory.yml" target="_blank" style="margin-bottom:12px;font-size:13px;padding:10px">
        ✏️ Предложить теорию
      </a>
      <div id="theoriesList"></div>
    </div>

  </aside>

  <!-- MAIN -->

  <main class="main">

    <header class="topbar">

      <button class="btn" onclick="toggleSidebar()">
        ☰
      </button>

      <div class="top-title" id="topTitle">
        Загрузка...
      </div>

      <div class="actions">

        <button class="btn" onclick="toggleFullscreen()">
          ⛶
        </button>

      </div>

    </header>

    <section class="reader" id="reader"></section>

  </main>

</div>

<!-- MOBILE NAV -->

<nav class="mobile-nav">

  <button class="btn" onclick="toggleSidebar()">
    Главы
  </button>

  <button
    class="btn"
    onclick="window.scrollTo({top:0,behavior:'smooth'})"
  >
    ↑
  </button>

</nav>

<!-- ZOOM -->

<div class="zoom" id="zoom">

  <button class="close" onclick="closeZoom()">
    ✕
  </button>

  <img id="zoomImg">

</div>

<script>

const state = {
  volumes:{},
  volume:null,
  chapter:null
};

const $ = id => document.getElementById(id);

/* READ */

function getReadKey(v,c){
  return `read_${v}_${c}`;
}

function isRead(v,c){
  return localStorage.getItem(getReadKey(v,c)) === '1';
}

function toggleRead(){

  const key = getReadKey(
    state.volume,
    state.chapter
  );

  if(isRead(state.volume,state.chapter)){
    localStorage.removeItem(key);
  }else{
    localStorage.setItem(key,'1');
  }

  renderChapters();

  openChapter(state.chapter);

}

/* UPDATE CHECK */

function dismissBanner(){
  document.getElementById('updateBanner')
    .classList.remove('show');
}

async function checkUpdate(){

  try{

    const res = await fetch('version.json');

    const local = await res.json();

    if(!local.repo || local.repo === 'YOUR_USERNAME/YOUR_REPO') return;

    const api = await fetch(
      `https://api.github.com/repos/${local.repo}/releases/latest`,
      { signal: AbortSignal.timeout(8000) }
    );

    if(!api.ok) return;

    const rel = await api.json();

    const latest = rel.tag_name.replace(/^v/,'');

    const current = local.version;

    if(latest !== current){

      const banner = document.getElementById('updateBanner');

      banner.innerHTML = `
        <a
          href="${rel.html_url}"
          target="_blank"
          style="color:#fff;text-decoration:none"
        >
          ⬇ Доступно обновление ${rel.tag_name}
        </a>
        <button
          class="close-banner"
          onclick="event.stopPropagation();dismissBanner()"
        >✕</button>
      `;

      setTimeout(()=>banner.classList.add('show'), 500);

    }

  }catch{
    // ignore network errors
  }

}

/* INIT */

async function init(){

  try{

    state.volumes =
      await (await fetch('chapters.json')).json();

  }catch{

    state.volumes = {
      1:{
        title:"Том 1",
        chapters:{
          1:{
            title:"Глава 1",
            pages:[
              "Glava1/1.webp",
              "Glava1/2.webp",
              "Glava1/3.webp"
            ]
          },
          2:{
            title:"Глава 2",
            pages:[
              "Glava2/1.webp",
              "Glava2/2.webp"
            ]
          },
          3:{
            title:"Глава 3",
            releaseDate:"2026-12-31T12:00:00"
          }
        }
      }
    };

  }

  renderVolumes();

  checkUpdate();

  const first = Object.keys(state.volumes)[0];

  openVolume(first);

}

/* VOLUMES */

function renderVolumes(){

  $('volumes').innerHTML='';

  Object.entries(state.volumes).forEach(([id,v])=>{

    const btn = document.createElement('button');

    btn.className='volume-btn';

    if(id == state.volume){
      btn.classList.add('active');
    }

    btn.textContent=v.title;

    btn.onclick=()=>openVolume(id);

    $('volumes').appendChild(btn);

  });

}

/* CHAPTERS */

function renderChapters(){

  $('chapters').innerHTML='';

  const chapters =
    state.volumes[state.volume].chapters;

  Object.entries(chapters).forEach(([id,ch])=>{

    const btn = document.createElement('button');

    btn.className='chapter-btn';
    btn.dataset.chapterId = id;
    btn.dataset.volumeId = state.volume;

    if(id == state.chapter){
      btn.classList.add('active');
    }

    if(isRead(state.volume,id)){
      btn.classList.add('read');
    }

    if(
      ch.releaseDate &&
      new Date(ch.releaseDate) > new Date()
    ){
      btn.classList.add('locked');
    }

    btn.innerHTML=`
      <div>${ch.title}</div>

      ${
        ch.releaseDate
        ? `<div class="timer" data-date="${ch.releaseDate}">${getRemaining(ch.releaseDate)}</div>`
        : ''
      }
    `;

    btn.onclick=()=>{

      openChapter(id);

      closeSidebar();

    };

    $('chapters').appendChild(btn);

  });

}

/* OPEN VOLUME */

function openVolume(id){

  state.volume=id;

  renderVolumes();

  renderChapters();

  const first =
    Object.keys(
      state.volumes[id].chapters
    )[0];

  openChapter(first);

}

/* OPEN CHAPTER */

function openChapter(id){

  state.chapter=id;

  renderChapters();

  const ch =
    state.volumes[state.volume].chapters[id];

  $('topTitle').textContent=ch.title;

  const reader = $('reader');

  reader.innerHTML='';

  /* HEADER */

  const header = document.createElement('div');

  header.className='chapter-header';

  header.innerHTML=`
    <div class="chapter-title">
      ${ch.title}
    </div>

    <div class="chapter-meta">

      <button
        class="read-btn ${isRead(state.volume,id)?'read':''}"
        onclick="toggleRead()"
      >

        ${
          isRead(state.volume,id)
          ? '✓ Прочитано'
          : 'Отметить прочитанным'
        }

      </button>

    </div>
  `;

  reader.appendChild(header);

  /* LOCK */

  if(
    ch.releaseDate &&
    new Date(ch.releaseDate) > new Date()
  ){

    const locked = document.createElement('div');

    locked.style.textAlign='center';

    locked.style.marginTop='40px';

    locked.innerHTML=`
      <div
        style="
          font-size:22px;
          color:#ff7eb6;
          margin-bottom:14px;
        "
      >
        Глава скоро выйдет
      </div>

      <div
        class="timer"
        data-date="${ch.releaseDate}"
        style="
          font-size:34px;
          font-weight:800;
        "
      >
        ${getRemaining(ch.releaseDate)}
      </div>
    `;

    reader.appendChild(locked);

    return;

  }

  /* PAGES */

  if(ch.pages){

    ch.pages.forEach((src,i)=>{

      const wrap = document.createElement('div');

      wrap.className='page-wrap';

      const img = document.createElement('img');

      img.className='page';

      img.loading='lazy';

      img.src=src;

      img.onclick=()=>openZoom(src);

      const num = document.createElement('div');

      num.className='page-number';

      num.textContent='Страница '+(i+1);

      wrap.append(img,num);

      reader.appendChild(wrap);

    });

  }

}

/* TIMER */

function getRemaining(date){

  const now = new Date();

  const target = new Date(date);

  const diff = target - now;

  if(diff <= 0){
    return 'Доступно!';
  }

  const d = Math.floor(diff/86400000);

  const h = Math.floor((diff%86400000)/3600000);

  const m = Math.floor((diff%3600000)/60000);

  const s = Math.floor((diff%60000)/1000);

  return `${d}д ${h}ч ${m}м ${s}с`;

}

/* LIVE TIMER UPDATE */

setInterval(()=>{

  const now = Date.now();

  document.querySelectorAll('.timer')
    .forEach(el=>{

      const date = el.dataset.date;
      if(!date) return;

      const diff = new Date(date) - now;

      if(diff <= 0){

        el.textContent = 'Доступно!';

        const btn = el.closest('.chapter-btn');
        if(btn){
          btn.classList.remove('locked');
          btn.onclick = ()=>{
            const id = btn.dataset.chapterId;
            const vol = btn.dataset.volumeId;
            if(id && vol){
              state.volume = vol;
              renderVolumes();
              openChapter(id);
              closeSidebar();
            }
          };
        }

      }else{

        el.textContent = getRemaining(date);

      }

    });

},1000);

/* SEARCH */

$('search').addEventListener('input',e=>{

  const q = e.target.value.toLowerCase();

  const sel = currentTab === 'volumes'
    ? '#chapters .chapter-btn'
    : '#theoriesList .chapter-btn';

  document.querySelectorAll(sel)
    .forEach(btn=>{

      btn.style.display =
        btn.textContent
          .toLowerCase()
          .includes(q)
        ? 'block'
        : 'none';

    });

});

/* SIDEBAR */

function toggleSidebar(){

  $('sidebar').classList.toggle('open');

  $('sidebarBackdrop')
    .classList.toggle('show');

}

function closeSidebar(){

  $('sidebar').classList.remove('open');

  $('sidebarBackdrop')
    .classList.remove('show');

}

/* FULLSCREEN */

function toggleFullscreen(){

  if(!document.fullscreenElement){

    document.documentElement
      .requestFullscreen();

  }else{

    document.exitFullscreen();

  }

}

/* ZOOM */

function openZoom(src){

  $('zoomImg').src=src;

  $('zoom').classList.add('active');

  document.body.style.overflow='hidden';

}

function closeZoom(){

  $('zoom').classList.remove('active');

  document.body.style.overflow='';

}

/* ESC */

document.addEventListener('keydown',e=>{

  if(e.key==='Escape'){
    closeZoom();
  }

});

/* SERVICE WORKER */

if('serviceWorker' in navigator){

  navigator.serviceWorker
    .register('sw.js')
    .catch(()=>{});

}

/* THEORIES */

let theoriesData = {};
let currentTheory = null;
let currentTab = 'volumes';

async function loadTheories(){
  try{
    const res = await fetch('https://api.github.com/repos/wolf111234/ReadMyComics/issues?labels=theory&state=open&sort=created&direction=desc', { signal: AbortSignal.timeout(5000) });
    if(res.ok){
      const issues = await res.json();
      theoriesData = {};
      issues.forEach(issue => {
        theoriesData[issue.number] = {
          title: issue.title.replace('[Теория] ',''),
          content: issue.body || 'Нет текста',
          url: issue.html_url
        };
      });
      return;
    }
  }catch{}
  try{
    theoriesData = await (await fetch('theories.json')).json();
  }catch{
    theoriesData = {};
  }
}

function switchTab(tab){
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  $('volumesSection').style.display = 'none';
  $('theoriesSection').style.display = 'none';
  $('search').value = '';
  if(tab === 'volumes'){
    $('search').placeholder = 'Поиск главы...';
    $('volumesSection').style.display = 'block';
    document.querySelectorAll('#chapters .chapter-btn').forEach(b => b.style.display = 'block');
  }else{
    $('search').placeholder = 'Поиск теории...';
    $('theoriesSection').style.display = 'block';
    renderTheories();
  }
}

function renderTheories(){
  $('theoriesList').innerHTML = '';
  const ids = Object.keys(theoriesData).sort((a,b) => b - a);
  if(ids.length === 0){
    $('theoriesList').innerHTML = '<div style="color:var(--muted);text-align:center;padding:20px">Пока нет теорий</div>';
    return;
  }
  ids.forEach(id => {
    const t = theoriesData[id];
    const btn = document.createElement('button');
    btn.className = 'chapter-btn';
    if(id == currentTheory) btn.classList.add('active');
    btn.innerHTML = `<div>${t.title}</div>`;
    btn.onclick = () => { openTheory(id); closeSidebar(); };
    $('theoriesList').appendChild(btn);
  });
}

function openTheory(id){
  currentTheory = id;
  const t = theoriesData[id];
  if(!t) return;
  $('topTitle').textContent = t.title;
  const reader = $('reader');
  reader.innerHTML = `
    <div class="chapter-header">
      <div class="chapter-title">${t.title}</div>
    </div>
    <div style="max-width:750px;margin:0 auto;line-height:1.8;font-size:16px;color:var(--text);white-space:pre-wrap">${t.content}</div>
    ${t.url ? `<div style="text-align:center;margin-top:30px"><a href="${t.url}" target="_blank" style="color:var(--accent);font-size:13px">🔗 Открыть в GitHub</a></div>` : ''}
  `;
  renderTheories();
}

/* START */

init();

</script>

</body>
</html>
